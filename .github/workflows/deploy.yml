name: Deploy (Fly.io)

# Deploy manual e protegido: requer o secret FLY_API_TOKEN no repositório
# (Settings → Secrets → Actions). Ver docs/08-runbook-operacional.md.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Digite "deploy" para confirmar o deploy em produção'
        required: true

permissions:
  contents: read

jobs:
  deploy:
    if: github.event.inputs.confirm == 'deploy'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Verify FLY_API_TOKEN is configured
        run: |
          if [ -z "${FLY_API_TOKEN}" ]; then
            echo "::error::FLY_API_TOKEN secret is not configured. Create it with: gh secret set FLY_API_TOKEN --repo ${{ github.repository }}"
            exit 1
          fi
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Fly deploy
        run: flyctl deploy --remote-only --config fly.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Post-deploy healthcheck
        run: |
          sleep 15
          curl -fsS "https://${FLY_APP_NAME:-chatgpt-anki-mcp}.fly.dev/health" | grep -q '"status":"ok"'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
