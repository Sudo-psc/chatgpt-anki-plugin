name: CI

on:
  push:
    branches: [main, develop, 'feat/**', 'fix/**', 'release/**']
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  quality-and-test:
    name: Lint, Typecheck, Tests & Coverage (>=80%)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit, Integration & Contract Tests with Coverage Gate (>=80%)
        run: npm run test:coverage

      - name: Build production bundle
        run: npm run build

      - name: Generate CycloneDX SBOM
        run: npx --yes @cyclonedx/cyclonedx-npm --output-file sbom.cdx.json

      - name: Upload Coverage & SBOM Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quality-artifacts
          path: |
            coverage/
            sbom.cdx.json

  e2e-widgets:
    name: Playwright E2E (OpenAI Apps SDK Widgets)
    runs-on: ubuntu-latest
    needs: quality-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        run: npm run test:e2e

  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
