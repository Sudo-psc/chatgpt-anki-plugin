# App dedicado: microsserviço "AnkiWeb como API" (Anki headless syncado à conta
# AnkiWeb + AnkiConnect local + servidor MCP, TUDO na mesma máquina).
#
#   fly apps create chatgpt-anki-real
#   fly secrets set TOKEN_SECRET="$(openssl rand -base64 48)" OWNER_PASSWORD="<forte>"
#   fly volumes create anki_data --size 1 -r gru        (uma vez)
#   fly deploy --config fly.ankiweb.toml
#
# Depois: enviar o perfil do Anki (com a sessão AnkiWeb) para o volume /data —
# ver docker/ankiweb-service/README.md §3 e docs/08-runbook-operacional.md §9.
app = 'chatgpt-anki-real'
primary_region = 'gru'

[build]
  dockerfile = 'docker/ankiweb-service/Dockerfile'

[env]
  PORT = '8080'
  HOST = '0.0.0.0'
  PUBLIC_BASE_URL = 'https://chatgpt-anki-real.fly.dev'
  ANKI_BASE = '/data'
  ANKI_BACKEND = 'connect'
  ANKI_CONNECT_URL = 'http://127.0.0.1:8765'
  SYNC_INTERVAL_SECONDS = '900'
  # Nome exato do perfil Anki copiado para o volume.
  ANKI_PROFILE = 'Usuário 1'

[[mounts]]
  source = 'anki_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  # O loop de sync precisa de processo vivo: sem auto-stop.
  auto_stop_machines = 'off'
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '120s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
