services:
  mcp-anki-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      HOST: 0.0.0.0
      PORT: 3000
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      ANKI_BACKEND: ${ANKI_BACKEND:-ankiconnect}
      ANKICONNECT_URL: ${ANKICONNECT_URL:-http://host.docker.internal:8765}
      ANKI_READ_ONLY: ${ANKI_READ_ONLY:-0}
      OAUTH_JWT_SECRET: ${OAUTH_JWT_SECRET:-replace-with-strong-32-character-random-secret-value}
      OAUTH_AUTHORIZE_PIN: ${OAUTH_AUTHORIZE_PIN:-anki-dev-pin}
      BRIDGE_SHARED_TOKEN: ${BRIDGE_SHARED_TOKEN:-}
    restart: unless-stopped
