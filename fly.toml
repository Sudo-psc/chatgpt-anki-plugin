# Fly.io deployment for the chatgpt-anki-plugin MCP server (M5).
# 1. fly apps create chatgpt-anki-mcp-sudo
# 2. fly secrets set TOKEN_SECRET="$(openssl rand -base64 48)" OAUTH_CLIENT_ID=chatgpt
# 3. fly deploy --dockerfile docker/Dockerfile
# Ver docs/08-runbook-operacional.md para rotação de segredos e rollback.
#
# Esta instância roda como DEMO pública (coleção 100% sintética; serve à revisão
# da OpenAI e ao developer mode do ChatGPT). Para uso pessoal real, troque para o
# backend connect apontando ANKI_CONNECT_URL ao seu AnkiConnect via túnel privado:
#   fly secrets set ANKI_BACKEND=connect ANKI_CONNECT_URL=https://<tunel> ANKI_CONNECT_API_KEY=...
#
# LIMITAÇÃO DE ESCALA: códigos OAuth, clientes DCR e rate limit vivem em MEMÓRIA
# do processo — mantenha UMA machine (fly scale count 1; já aplicado). Com 2+
# machines sem sticky sessions, o token exchange pode cair em outra instância e
# falhar com invalid_grant. Store compartilhado: roadmap R-03 (ADR-0007).
app = 'chatgpt-anki-mcp-sudo'
primary_region = 'gru'

[build]
  dockerfile = 'docker/Dockerfile'

[env]
  PORT = '8080'
  HOST = '0.0.0.0'
  PUBLIC_BASE_URL = 'https://chatgpt-anki-mcp-sudo.fly.dev'
  ANKI_BACKEND = 'mock'

[http_service]
  internal_port = 8080
  force_https = true
  # 'suspend' preserva a memória no idle (códigos OAuth de 60s sobrevivem ao cold start).
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
