# Fly.io deployment for the chatgpt-anki-plugin MCP server (M5).
# 1. fly apps create chatgpt-anki-mcp
# 2. fly secrets set TOKEN_SECRET="$(openssl rand -base64 48)" OAUTH_CLIENT_ID=chatgpt
# 3. fly deploy --dockerfile docker/Dockerfile
# Ver docs/08-runbook-operacional.md para rotação de segredos e rollback.
app = 'chatgpt-anki-mcp'
primary_region = 'gru'

[build]
  dockerfile = 'docker/Dockerfile'

[env]
  PORT = '8080'
  HOST = '0.0.0.0'
  # Ajuste PUBLIC_BASE_URL para https://<app>.fly.dev em produção.
  PUBLIC_BASE_URL = 'http://localhost:8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
